version: "3.9"

services:
  postgres_db:
    image: postgres:15
    container_name: tradegraph_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j_db:
    image: neo4j:5-community
    container_name: tradegraph_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    volumes:
      - neo4j_data:/data

  adminer:
    image: adminer:latest
    container_name: tradegraph_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  neo4j_data:
